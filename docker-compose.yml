services:
  backend:
    container_name: volleyball-backend

    build:
      context: ./backend
      dockerfile: Dockerfile

    env_file:
      - ./backend/.env

    environment:
      NODE_ENV: production
      HOST: 0.0.0.0
      PORT: 3333
      APP_URL: http://localhost:3333
      CORS_ORIGIN: http://localhost:5173,http://localhost:5174

    ports:
      - "3333:3333"

    restart: unless-stopped


  admin:
    container_name: volleyball-admin

    build:
      context: ../volleyball-scoreboard-frontend
      dockerfile: Dockerfile

      args:
        VITE_API_URL: http://localhost:3333
        VITE_WS_URL: http://localhost:3333
        VITE_TV_URL: http://localhost:5174

    ports:
      - "5173:80"

    depends_on:
      - backend

    restart: unless-stopped


  tv:
    container_name: volleyball-tv

    build:
      context: ../volleyball-scoreboard-tv
      dockerfile: Dockerfile

      args:
        VITE_API_URL: http://localhost:3333
        VITE_WS_URL: http://localhost:3333

    ports:
      - "5174:80"

    depends_on:
      - backend

    restart: unless-stopped
